{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Fácil NAF</title>
    <link rel="icon" type="image/ico" href="{% static 'imagens/ICON003.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/index.js' %}"></script>
    <script src="{% static 'login_agendafacil/js/index.js' %}"></script>
</head>
<body>  
    <div class="site-header">
        <img src="{% static 'imagens/logo001.png' %}" width=320px>
    </div>
    <center> 
        <div class="container">              
            <br><br>
              <p>Insira seu e-mail para resetar sua senha</p>


            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <p><input type="submit" value="Enviar e-mail"></p>
            </form>
               <div class="email">
               <img class="emailpng" src="{% static 'imagens/Email.png' %}">
               </div>
            <div class="divbtn">
                <a href="{% url 'base' %}"><button >Inicio</a>
           </div>
            <br><br>
       </div>
    </center>
    <br><br>
    <br><br>
<div class="site-footer">
Copyright © 2026 — Desenvolvido com 💚 em Teresópolis.
</div>
</body>
</html>
