{% extends 'base.html' %}
{% load static %}

{% block title %}Login Cliente{% endblock %}

{% block content %}


<div class="container">

    <h1 style="text-align:center;">Bem-Vindo(a)!</h1>

    <div class="container2">
        <center>

        <h2>Faça seu Login</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- Username = CPF -->
            <input class="inputlogin"
                   type="text"
                   name="username"
                   placeholder="CPF"
                   required>

            <br><br>

            <!-- Password -->
            <input class="inputlogin"
                   type="password"
                   name="password"
                   placeholder="Senha"
                   required>

            <br><br>
            <a href="{% url 'painel_cliente' %}">
        
            <button class="btn" type="submit">Entrar</button>
                </a>
        </form>

        <br>

        <a href="{% url 'esqueci_senha' %}">
            <button >Esqueci a senha</button>
        </a>

        <br><br>

        <a href="{% url 'cadastro_cliente' %}">
            <button >Cadastre-se</button>
        </a>

        <br><br>

        </center>
    </div>
{% endblock %}
