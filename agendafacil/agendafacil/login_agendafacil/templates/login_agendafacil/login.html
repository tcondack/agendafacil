{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Cliente</title>

    <link rel="icon" type="image/ico" href="{% static 'imagens/ICON003.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/Index.js' %}"></script>
</head>

<body>

<div class="site-header">
    <img src="{% static 'imagens/logo001.png' %}" width="320px">
    <button class="menu-button" onclick="toggleMenu()">Menu</button>

    <div class="menu" id="menu">
        <a href="{% url 'index' %}" class="button">Inicio</a>
    </div>
</div>

<div class="container">

    <h1 style="text-align:center;">Bem-Vindo(a)!</h1>

    <div class="container2">
        <center>

        <h2>Faça seu Login</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- Username = CPF -->
            <input class="inputlogin"
                   type="text"
                   name="username"
                   placeholder="CPF"
                   required>

            <br><br>

            <!-- Password -->
            <input class="inputlogin"
                   type="password"
                   name="password"
                   placeholder="Senha"
                   required>

            <br><br>

            <button class="btn bt5" type="submit">Entrar</button>

        </form>

        <br>

        <a href="#">
            <button class="btn">Esqueci a senha</button>
        </a>

        <br><br>

        <a href="{% url 'cadastro_cliente' %}">
            <button class="btn">Cadastre-se</button>
        </a>

        <br><br>

        </center>
    </div>

</div>

<div class="site-footer">
Copyright © 2026 — Desenvolvido com 💚 em Teresópolis.
</div>

</body>
</html>
