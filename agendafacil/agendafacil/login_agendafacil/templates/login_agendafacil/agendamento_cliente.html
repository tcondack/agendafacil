{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Fácil NAF</title>
    <link rel="icon" type="image/ico" href="{% static 'imagens/ICON003.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'login_agendafacil/js/index.js' %}"></script>
</head>
<body>  
    <div class="site-header">
        <img src="{% static 'imagens/logo001.png' %}" width=320px>
        <button class="menu-button" onclick="toggleMenu()">Menu</button>
        <div class="menu" id="menu">
                <a href="{% url 'painel_cliente'%}" class="button">Pagina Inicial</a>
                <a href="{% url 'perfil_cliente'%}" class="button">Meu Perfil</a>
                <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="button">Sair</button>
            </form>
            </div>
    </div>
<div class="container">   
    <h1><center>Agendamento</center></h1>
    <h2><center>Faça o seu agendamento.</center></h2>

    <!-- 1. Seleção de data via GET -->
    <form class="form1" method="get">
        <label for="data">Data:</label>
        <input type="date" id="data" name="data" min="{{ hoje|date:'Y-m-d' }}" value="{{ data_selecionada }}">
        <button class="btn" type="submit">Buscar Horários</button>
    </form>

    <br>

    <!-- 2. Agendamento via POST, só aparece após buscar -->
    {% if horarios %}
    <form class="form1" method="post">
        {% csrf_token %}
        <input type="hidden" name="data" value="{{ data_selecionada }}">
        <label for="horario_id">Horário:</label>
        <select id="horario_id" name="horario_id" required>
            <option value="">Selecione um horário</option>
            {% for horario in horarios %}
                <option value="{{ horario.id }}">{{ horario.horario|time:"H:i" }} — {{ horario.atendente.first_name }}</option>
            {% endfor %}
        </select>
        <button class="btn" type="submit">Agendar</button>
    </form>
    {% elif data_selecionada %}
        <p>Nenhum horário disponível para esta data.</p>
    {% endif %}
</div>
<br><br>
    </div>
            <br><br>         
    <br><br> 
    <br><br>
    <div class="site-footer">
Copyright © 2026 — Desenvolvido com 💚 em Teresópolis.
    </div>
</body>
</html>
