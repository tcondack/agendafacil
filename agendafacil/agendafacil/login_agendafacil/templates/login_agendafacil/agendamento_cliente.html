{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>
     <link rel="icon" type="image/ico" href="{% static 'imagens/ICON003.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/index.js' %}"></script>
    <style>
        input,  select {
        width: 60%;
        padding: 8px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;}
    </style>
</head>
<body>
    <div class="site-header">
        <img src="{% static 'imagens/logo001.png' %}" width=320px>
            <button class="menu-button" onclick="toggleMenu()">Menu</button>
            <div class="menu" id="menu">
                <a href="{% url 'painel_cliente'%}" class="button">Pagina Inicial</a>
                <a href="Dados Cliente.html" class="button">Meu Perfil</a>
                <a href="Feedback.html" class="button">Avaliaçao</a>
                <a href="Login Cliente.html" class="button">Sair</a>
            </div>
    </div>
    <div class="container">   
        <h1><center>Agendamento</center></h1>
                <H2><center>Faça o seu agendamento.</center></H2> 
                     <form class="form1" method="post"> {% csrf_token %}
                        <label for="data">Data:</label>
                        <input type="date" id="data" name="data" required>
                        <label for="horario">Horário:</label>
                        <select id="horario" name="horario" placeholder="Defina um horário" required>
                           <option value=""></option>
                            <option value="09:00">09:00</option>
                            <option value="10:00">10:00</option>
                            <option value="11:00">11:00</option>
                            <option value="12:00">12:00</option>
                            <option value="13:00">13:00</option>
                            <option value="14:00">14:00</option>
                            <option value="15:00">15:00</option>
                            <option value="16:00">16:00</option>
                        </select>
                        <button class="btn" type="submit">Agendar</button>

                    </form><br><br>
            </div>
            <br><br>         
    </div>
    <br><br> 
    <br><br>
    <div class="site-footer">
Copyright © 2026 — Desenvolvido com 💚 em Teresópolis.
    </div>
</body>
</html>
