<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Padrão</title>
    <link rel="icon" type="image/ico" href="IMAGENS/ICON003.ico">
    <link rel="stylesheet" href="style.css">
    <script src="JS/Index.js" type="text/javascript"></script>
</head>
<body>  
    <!-- Cabeçalho -->
    <div class="site-header">
        <img src="IMAGENS/logo001.png" width="320px" alt="Logo">
        <button class="menu-button" onclick="toggleMenu()">Menu</button>
        <div class="menu" id="menu">
            <a href="index.html" class="button">Início</a>
            <a href="Login Cliente.html" class="button">Sou Cliente</a>
            <a href="Login Colaborador.html" class="button">Sou Colaborador</a>
        </div>
    </div>

    <!-- Conteúdo principal -->
    <div class="container">
        <center>
            <h2>Bem-vindo!</h2>
            <p>Esta é uma página padrão. Você pode usá-la como base para outras funcionalidades.</p>
        </center>

        <!-- Formulário opcional (exemplo) -->
        <form class="form1" action="#">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@unifesonaf.com" required>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem..." required></textarea>

            <button class="btn" type="submit">Enviar</button>
        </form>
    </div>

    <!-- Rodapé -->
    <div class="site-footer">
        Copyright © 2024.
    </div>
</body>
