{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Agenda Fácil NAF{% endblock %}</title>

    <link rel="icon" type="image/ico" href="{% static 'imagens/ICON003.ico' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/index.js' %}" defer></script>
</head>
<body>

    <!-- HEADER -->
    <div class="site-header">
        <img src="{% static 'imagens/logo001.png' %}" width="320px">

        {% if user.is_authenticated %}
            Olá, {{ user.username }} |
            <a href="{% url 'logout' %}" class="menu-button">Sair</a>
        {% else %}
            <a href="{% url 'login' %}" class="menu-button">Login</a>
        {% endif %}
    </div>

    <!-- CONTEÚDO DINÂMICO -->
    <div class="container">
        <div class="site-content">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <br><br><br>

    <!-- FOOTER -->
    <div class="site-footer">
        Copyright © 2026 — Desenvolvido com 💚 em Teresópolis.
    </div>

</body>
</html>
